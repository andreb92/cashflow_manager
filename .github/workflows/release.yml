name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release & publish image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # needed by semantic-release to create tags/releases
      packages: write # needed to push to GHCR
      issues: write # needed by @semantic-release/github to comment on issues
      pull-requests: write # needed by @semantic-release/github to comment on PRs
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/cashflow-manager:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/${{ github.repository_owner }}/cashflow-manager:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Personal cashflow manager — FastAPI backend + React frontend
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in deploy/docker-compose.yml
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          NEW_VERSION="${{ steps.semantic.outputs.new_release_version }}"
          OWNER="${{ github.repository_owner }}"
          sed -i -E "s|^([[:space:]]*)image: ghcr.io/${OWNER}/cashflow-manager:.*|\1image: ghcr.io/${OWNER}/cashflow-manager:${NEW_VERSION}|" deploy/docker-compose.yml
          grep -q "ghcr.io/${OWNER}/cashflow-manager:${NEW_VERSION}" deploy/docker-compose.yml \
            || { echo "sed substitution failed — image line not found in deploy/docker-compose.yml"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/docker-compose.yml
          git commit -m "chore(deploy): bump image to v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
