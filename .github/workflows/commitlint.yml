name: Commitlint

on:
  pull_request:

jobs:
  conventional-commits:
    name: Validate conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate each commit message
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=200
          # Conventional Commits regex — matches the types semantic-release recognises
          # plus an optional scope, optional "!" for breaking, and a non-empty subject.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          # Validate exactly the PR's commits — use the PR head SHA (not the synthetic
          # refs/pull/N/merge HEAD that actions/checkout resolves by default) and skip
          # merge commits in the range.
          base=$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")
          commits=$(git log --no-merges --format='%H %s' "${base}..${HEAD_SHA}")
          failed=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha=${line%% *}
            msg=${line#* }
            if ! echo "$msg" | grep -Eq "$pattern"; then
              echo "::error::Non-conventional commit ${sha}: ${msg}"
              failed=1
            fi
          done <<< "$commits"
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Commits must follow Conventional Commits."
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Example: 'feat(auth): add OIDC token refresh'"
            exit 1
          fi
