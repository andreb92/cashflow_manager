name: Cleanup container images

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup-untagged:
    name: Delete old untagged GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: cashflow-manager
          package-type: container
          # Multi-arch child manifests are untagged in GHCR, so keep a wide buffer.
          min-versions-to-keep: 100
          delete-only-untagged-versions: 'true'
